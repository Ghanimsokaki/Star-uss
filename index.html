<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#04060d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="STAR TREK: ASCENSION — command a starship, explore the galaxy, fight hostile empires, build your civilization on Earth, and face the singularity." />
<title>STAR TREK: ASCENSION</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060912'/%3E%3Cpath d='M32 10 54 24v20L32 58 10 44V24Z' fill='none' stroke='%2359e0ff' stroke-width='2.4'/%3E%3Ccircle cx='32' cy='34' r='6' fill='none' stroke='%23ffb347' stroke-width='2.4'/%3E%3Cpath d='M32 18v8M32 42v8' stroke='%2359e0ff' stroke-width='2'/%3E%3C/svg%3E" />
</head>
<body>
<div id="app">
  <canvas id="viewport" aria-label="3D game viewport"></canvas>
  <div id="planet-glow" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="ui" aria-live="polite"></div>
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-emblem">
        <svg viewBox="0 0 100 100" width="86" height="86" aria-hidden="true">
          <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#59e0ff"/><stop offset="100%" stop-color="#ffb347"/>
          </linearGradient></defs>
          <path d="M50 6 88 30v40L50 94 12 70V30Z" fill="none" stroke="url(#bg1)" stroke-width="1.5" opacity=".9"/>
          <path d="M50 18 78 36v28L50 82 22 64V36Z" fill="none" stroke="#59e0ff" stroke-width=".8" opacity=".45"/>
          <circle cx="50" cy="50" r="7" fill="none" stroke="#ffb347" stroke-width="2"/>
          <path d="M50 28v10M50 62v10M28 50h10M62 50h10" stroke="#59e0ff" stroke-width="1.5"/>
        </svg>
      </div>
      <h1 class="boot-title">STAR&nbsp;TREK<span>ASCENSION</span></h1>
      <div class="boot-bar"><i id="boot-fill"></i></div>
      <div class="boot-status" id="boot-status">Initializing warp core…</div>
      <div class="boot-tip" id="boot-tip">Tip: complete surveys and destroy raiders to earn energy credits.</div>
    </div>
  </div>
  <div id="fatal" hidden>
    <div>
      <h2>Unable to initialise the viewport</h2>
      <p id="fatal-msg">Your browser needs WebGL 2 and hardware acceleration enabled.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
