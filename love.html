<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2f45a8" />
<meta name="description" content="Dyas & Naswa — a little anime about the sky we share." />
<meta property="og:title" content="Dyas ♥ Naswa" />
<meta property="og:description" content="A little anime about the sky we share." />
<title>Dyas ♥ Naswa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f45a8'/%3E%3Cpath d='M32 52S12 39 12 25a10 10 0 0 1 20-3 10 10 0 0 1 20 3c0 14-20 27-20 27Z' fill='%23ff7aa8'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/love/love.css" />
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="letterbox top" aria-hidden="true"></div>
  <div class="letterbox bottom" aria-hidden="true"></div>

  <div id="title-card" class="title-card" hidden>
    <p class="kana" lang="ja">ディアス <span>♡</span> ナスワ</p>
    <h2 class="logo">Dyas <span class="heart">♥</span> Naswa</h2>
    <p class="episode">Episode 1 · The Sky We Share</p>
  </div>

  <div id="sub" class="sub" aria-live="polite">
    <span class="who"></span>
    <span class="line"></span>
  </div>

  <section id="intro" class="intro">
    <div class="intro-inner">
      <p class="kana" lang="ja">ふたりの空</p>
      <h1 class="logo">Dyas <span class="heart">♥</span> Naswa</h1>
      <p class="episode">Episode 1 · The Sky We Share</p>
      <button id="start" class="start" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        Play episode
      </button>
      <p class="hint">best with sound on</p>
    </div>
  </section>

  <div class="controls">
    <button id="sound" class="icon-btn" type="button" aria-label="Mute music" aria-pressed="true" hidden>
      <svg class="on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="replay" class="icon-btn" type="button" aria-label="Replay the episode" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <p id="tap-hint" class="tap-hint" hidden>tap anywhere to send love</p>

  <script type="module" src="/src/love/love.js"></script>
</body>
</html>
