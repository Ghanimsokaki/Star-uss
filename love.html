<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07020a" />
<meta name="description" content="Days & Naswa — a love story written in stars." />
<meta property="og:title" content="Days ♥ Naswa" />
<meta property="og:description" content="A love story written in stars." />
<title>Days ♥ Naswa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307020a'/%3E%3Cpath d='M32 52S12 39 12 25a10 10 0 0 1 20-3 10 10 0 0 1 20 3c0 14-20 27-20 27Z' fill='%23ff4d8d'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,400&family=Great+Vibes&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/love/love.css" />
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="story" aria-live="polite">
    <p id="caption" class="caption"></p>
  </main>

  <section id="intro" class="intro">
    <div class="intro-inner">
      <p class="eyebrow">a little universe for</p>
      <h1 class="intro-names">Days <span class="amp">&amp;</span> Naswa</h1>
      <button id="start" class="start" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8.2 3.3 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.7 0 6 3.7 4.5 7.2C19.5 16.4 12 21 12 21Z" fill="currentColor"/></svg>
        Open with love
      </button>
      <p class="hint">best with sound on</p>
    </div>
  </section>

  <div class="controls">
    <button id="sound" class="icon-btn" type="button" aria-label="Mute music" aria-pressed="true" hidden>
      <svg class="on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="replay" class="icon-btn" type="button" aria-label="Replay the story" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <p id="tap-hint" class="tap-hint" hidden>tap anywhere to send love</p>

  <script type="module" src="/src/love/love.js"></script>
</body>
</html>
