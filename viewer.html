<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04060d" />
<title>Hull viewer — STAR TREK: ASCENSION</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060912'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%2359e0ff' stroke-width='3'/%3E%3C/svg%3E" />
</head>
<body class="viewer-body">
<canvas id="viewer-canvas"></canvas>

<header class="viewer-bar">
  <div class="vb-brand"><b>HULL VIEWER</b><span id="file-name">drop a model</span></div>
  <div class="vb-stats" id="stats"></div>
  <div class="vb-actions">
    <button id="btn-wire" type="button" title="Wireframe (W)">WIRE</button>
    <button id="btn-grid" type="button" title="Grid + axes (G)">GRID</button>
    <button id="btn-spin" type="button" class="on" title="Auto-spin (S)">SPIN</button>
    <button id="btn-front" type="button" title="Look from the nose (+Z is the game's forward)">NOSE</button>
    <button id="btn-open" type="button">OPEN…</button>
  </div>
</header>

<label class="viewer-drop" id="drop">
  <input type="file" id="file" accept=".glb,.gltf,.fbx" hidden />
  <div class="vd-inner">
    <div class="vd-ico">⬡</div>
    <h1>Drop an FBX or GLB</h1>
    <p>Inspect a hull before it goes in the game: orientation, scale, triangle count and textures.
       Nothing is uploaded — the file is read in your browser.</p>
    <span class="vd-btn">Choose a file</span>
    <small>.fbx · .glb · .gltf</small>
  </div>
</label>

<footer class="viewer-tip" id="tip">Drag to orbit · wheel to zoom · <b>NOSE</b> shows the game's forward axis (+Z)</footer>

<script type="module" src="/src/viewer.js"></script>
</body>
</html>
